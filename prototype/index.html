<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fractal Intelligence — Reasoning Highway Visualizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/3d-force-graph"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg-0: #06060a;
    --bg-1: rgba(12,12,18,0.75);
    --bg-2: rgba(20,20,30,0.6);
    --border: rgba(255,255,255,0.06);
    --border-hover: rgba(129,140,248,0.3);
    --text-0: #f4f4f5;
    --text-1: #a1a1aa;
    --text-2: #71717a;
    --accent: #5eead4;
    --accent-dim: rgba(94,234,212,0.12);
    --glass-blur: blur(16px) saturate(1.6);
    --glow: 0 0 20px rgba(129,140,248,0.15);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg-0);
    color: var(--text-1);
    overflow: hidden;
    height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ═══ Header ═══ */
  #header {
    position: fixed; top: 0; left: 0; right: 0; height: 52px;
    background: var(--bg-1);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px; z-index: 100;
  }
  #header h1 {
    font-size: 15px; font-weight: 600; color: var(--text-0);
    letter-spacing: -0.01em;
  }
  #header h1 span { color: var(--accent); }

  .controls { display: flex; align-items: center; gap: 16px; }
  .cg { display: flex; align-items: center; gap: 6px; }
  .cg label {
    font-size: 10px; color: var(--text-2); text-transform: uppercase;
    letter-spacing: 0.6px; font-weight: 500;
  }
  .cg input[type="range"] {
    width: 140px; accent-color: var(--accent);
    height: 4px; border-radius: 2px;
  }
  .cg select, .cg input[type="text"] {
    background: rgba(255,255,255,0.04); color: var(--text-1);
    border: 1px solid var(--border); padding: 5px 10px;
    border-radius: 6px; font-size: 11px; font-family: inherit;
    transition: border-color 0.2s;
  }
  .cg select:focus, .cg input[type="text"]:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-dim);
  }
  .cg input[type="text"] { width: 140px; }
  #step-display {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px; color: var(--accent); font-weight: 500;
    min-width: 70px; font-variant-numeric: tabular-nums;
  }
  #play-btn {
    background: var(--accent); color: #fff; border: none;
    padding: 5px 14px; border-radius: 6px; cursor: pointer;
    font-size: 11px; font-weight: 600; font-family: inherit;
    transition: transform 0.1s, box-shadow 0.2s;
  }
  #play-btn:hover { transform: scale(1.04); box-shadow: var(--glow); }

  .stats-bar { display: flex; gap: 16px; font-size: 10px; color: var(--text-2); letter-spacing: 0.3px; }
  .stats-bar .v {
    color: var(--text-0); font-weight: 600;
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    font-variant-numeric: tabular-nums;
  }

  /* ═══ Graph area ═══ */
  #graph {
    position: fixed; top: 52px; left: 0; right: 380px; bottom: 190px;
    background:
      radial-gradient(circle at 50% 40%, rgba(129,140,248,0.03) 0%, transparent 60%),
      radial-gradient(circle 1px at center, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 100% 100%, 24px 24px;
  }

  /* ═══ Side panel ═══ */
  #side-panel {
    position: fixed; top: 52px; right: 0; bottom: 0; width: 380px;
    background: var(--bg-1);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    border-left: 1px solid var(--border);
    overflow-y: auto; padding: 20px; z-index: 90;
  }
  #side-panel h2 {
    font-size: 13px; font-weight: 600; color: var(--text-0);
    margin-bottom: 12px; letter-spacing: -0.01em;
  }
  .card {
    margin-bottom: 12px; padding: 12px 14px;
    background: rgba(255,255,255,0.03);
    border-radius: 10px; border: 1px solid var(--border);
    transition: border-color 0.2s, transform 0.15s;
  }
  .card:hover { border-color: var(--border-hover); }
  .card h3 {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.8px;
    color: var(--accent); margin-bottom: 6px; font-weight: 600;
  }
  .card p, .card li {
    font-size: 11px; line-height: 1.6; color: var(--text-1);
  }
  .card ul { list-style: none; padding: 0; }
  .card li { padding: 2px 0; }
  .card li::before { content: "→ "; color: #3f3f46; }

  .dtag {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 8px; margin: 2px; border-radius: 20px;
    font-size: 9px; background: rgba(255,255,255,0.04);
    color: var(--text-1); font-weight: 500;
  }
  .dtag::before {
    content: ''; width: 5px; height: 5px; border-radius: 50%;
    display: inline-block;
  }

  .ntitle {
    font-size: 18px; font-weight: 700; color: var(--text-0);
    margin-bottom: 4px; letter-spacing: -0.02em;
  }
  .nsub {
    font-size: 11px; color: var(--accent); margin-bottom: 12px;
    font-family: 'JetBrains Mono', monospace; font-weight: 400;
  }
  .ndesc {
    font-size: 12px; color: var(--text-1); line-height: 1.6;
    margin-bottom: 16px;
  }

  .problem-list { max-height: 55vh; overflow-y: auto; }
  .problem-item {
    padding: 8px 10px; margin-bottom: 4px;
    background: rgba(255,255,255,0.02); border-radius: 8px;
    cursor: pointer; font-size: 11px; line-height: 1.4;
    border: 1px solid transparent;
    transition: all 0.15s;
  }
  .problem-item:hover {
    border-color: var(--border-hover);
    background: rgba(129,140,248,0.04);
    transform: translateX(3px);
  }
  .problem-item .pid {
    font-family: 'JetBrains Mono', monospace;
    color: var(--accent); font-weight: 500; font-size: 10px;
  }
  .problem-item .pdom {
    color: var(--text-2); font-size: 9px; text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  /* ═══ Bottom panel ═══ */
  #bottom-panel {
    position: fixed; left: 0; right: 380px; bottom: 0; height: 190px;
    background: var(--bg-1);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    border-top: 1px solid var(--border);
    display: flex; gap: 24px; padding: 14px 24px; z-index: 90;
  }
  .chart-box { flex: 1; position: relative; }
  .chart-box h3 {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.8px;
    color: var(--text-2); margin-bottom: 8px; font-weight: 500;
  }

  /* ═══ Tooltip ═══ */
  #tooltip {
    position: fixed; pointer-events: none; z-index: 200;
    background: var(--bg-1);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 14px; max-width: 300px;
    display: none; box-shadow: var(--glow);
    border-left: 3px solid var(--accent);
  }
  #tooltip .tt-name { font-size: 13px; font-weight: 600; color: var(--text-0); }
  #tooltip .tt-sub {
    font-size: 10px; color: var(--accent); margin-top: 2px;
    font-family: 'JetBrains Mono', monospace;
  }
  #tooltip .tt-desc {
    font-size: 10px; color: var(--text-1); margin-top: 5px; line-height: 1.5;
  }

  /* ═══ Loading ═══ */
  #loading {
    position: fixed; inset: 0; background: var(--bg-0);
    display: flex; align-items: center; justify-content: center;
    z-index: 200; flex-direction: column; gap: 16px;
  }
  #loading p { color: var(--text-2); font-size: 13px; }
  .orbit-spinner {
    width: 36px; height: 36px; position: relative;
  }
  .orbit-spinner .ring {
    position: absolute; inset: 0;
    border: 2px solid transparent; border-radius: 50%;
  }
  .orbit-spinner .ring:nth-child(1) {
    border-top-color: var(--accent);
    animation: spin 1.2s linear infinite;
  }
  .orbit-spinner .ring:nth-child(2) {
    border-right-color: rgba(129,140,248,0.4);
    animation: spin 1.8s linear infinite reverse;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .back-btn {
    margin-top: 10px; background: rgba(255,255,255,0.04);
    color: var(--text-1); border: 1px solid var(--border);
    padding: 6px 14px; border-radius: 6px; cursor: pointer;
    font-size: 11px; font-family: inherit; transition: all 0.15s;
  }
  .back-btn:hover {
    border-color: var(--border-hover);
    background: rgba(129,140,248,0.06);
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 10px; }
  * { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.08) transparent; }
</style>
</head>
<body>

<div id="loading">
  <div class="orbit-spinner"><div class="ring"></div><div class="ring"></div></div>
  <p>Loading tree data...</p>
</div>

<div id="tooltip">
  <div class="tt-name"></div>
  <div class="tt-sub"></div>
  <div class="tt-desc"></div>
</div>

<div id="header">
  <h1><span>Fractal Intelligence</span> &mdash; Reasoning Highways</h1>
  <div class="controls">
    <div class="cg">
      <label>Problem</label>
      <input type="range" id="step-slider" min="1" max="100" value="100">
      <span id="step-display">&mdash;</span>
      <button id="play-btn">Play</button>
    </div>
    <div class="cg">
      <label>Color</label>
      <select id="color-mode">
        <option value="domains">Domain count</option>
        <option value="invocations">Invocations</option>
        <option value="domain">Source domain</option>
      </select>
    </div>
    <div class="cg">
      <label>Problems</label>
      <select id="show-problems">
        <option value="show">Show</option>
        <option value="hide">Hide</option>
      </select>
    </div>
    <div class="cg">
      <label>Search</label>
      <input type="text" id="search-input" placeholder="Find concept...">
    </div>
  </div>
  <div class="stats-bar">
    <div>Nodes <span class="v" id="s-nodes">0</span></div>
    <div>Reuse <span class="v" id="s-reuse">0%</span></div>
    <div>Highways <span class="v" id="s-highways">0</span></div>
  </div>
</div>

<div id="graph"></div>

<div id="side-panel">
  <div id="panel-default">
    <h2>Click a node to inspect</h2>
    <p style="font-size:11px;color:var(--text-2);margin-bottom:14px;">
      Or pick a problem below to highlight its routing path.
    </p>
    <h3 style="font-size:10px;text-transform:uppercase;letter-spacing:0.8px;color:var(--text-2);margin-bottom:8px;font-weight:500;">Problems</h3>
    <div class="problem-list" id="problem-list"></div>
  </div>
  <div id="panel-node" style="display:none;"></div>
</div>

<div id="bottom-panel">
  <div class="chart-box">
    <h3>Reuse Curve</h3>
    <canvas id="reuse-chart"></canvas>
  </div>
  <div class="chart-box">
    <h3>Budget Allocation</h3>
    <canvas id="budget-chart"></canvas>
  </div>
</div>

<script>
// Modern muted palette — inspired by Linear/Raycast dark UI
const DC = {
  economics:'#f38ba8', education:'#f9e2af', game_design:'#a6e3a1',
  healthcare:'#89b4fa', urban_planning:'#cba6f7', legal_systems:'#fab387',
  software_architecture:'#89dceb', ecology:'#a6e3a1', cooking:'#f5c2e7',
  music_composition:'#5eead4', parenting:'#f2cdcd', corporate_governance:'#9399b2',
  sports_management:'#94e2d5', journalism:'#eba0ac', scientific_research:'#74c7ec',
  agriculture:'#a6d189', transportation:'#e5c890', diplomacy:'#babbf1',
  disaster_response:'#ea999c', architecture:'#c6d0f5',
};

let treeData, statsData, graph, reuseChart, budgetChart;
let currentStep = 100, isPlaying = false;

async function load() {
  try {
    [treeData, statsData] = await Promise.all([
      fetch('tree.json').then(r => r.json()),
      fetch('stats.json').then(r => r.json()),
    ]);
    document.getElementById('loading').style.display = 'none';
    init();
  } catch(e) {
    document.querySelector('#loading p').textContent = 'Run solver.py first to generate tree.json';
  }
}

function dcColor(c) {
  if (c >= 10) return '#f38ba8';  // rose
  if (c >= 7) return '#fab387';   // peach
  if (c >= 5) return '#f9e2af';   // yellow
  if (c >= 3) return '#a6e3a1';   // green
  if (c >= 2) return '#89b4fa';   // blue
  return '#6c7086';               // overlay
}
function invColor(c) {
  if (c >= 15) return '#f38ba8';
  if (c >= 10) return '#fab387';
  if (c >= 5) return '#f9e2af';
  if (c >= 3) return '#a6e3a1';
  return '#6c7086';
}

function buildData(maxP) {
  const nodes = [], links = [];
  const showProblems = document.getElementById('show-problems').value === 'show';
  const solvers = treeData.nodes.filter(n => n.created_by_problem <= maxP);
  const nodeMap = {};
  solvers.forEach(n => { nodeMap[n.id] = n; });

  solvers.forEach(n => { n._inv = 0; n._doms = new Set(); });
  const paths = treeData.routing_paths.filter(rp => rp.problem_id <= maxP);
  paths.forEach(rp => {
    rp.path.forEach(s => {
      const n = nodeMap[s.node];
      if (n) { n._inv++; n._doms.add(rp.domain); }
    });
  });

  // Find max invocations for scaling
  let maxInv = 1;
  solvers.forEach(n => { if ((n._inv||0) > maxInv) maxInv = n._inv; });

  const roots = new Set();
  const edges = treeData.edges.filter(e => e.problem_id <= maxP);
  edges.forEach(e => { if (e.source.startsWith('root_')) roots.add(e.source); });

  const cm = document.getElementById('color-mode').value;

  // RootSolver — the central node everything flows through
  const totalProblems = paths.length;
  nodes.push({
    id: 'ROOT_SOLVER',
    name: 'RootSolver',
    desc: 'The central solver that receives all problems and routes them through conceptual decomposition.',
    val: Math.max(6, 3 + totalProblems * 0.3),
    color: '#5eead4',
    inv: totalProblems, dc: 20,
    _isRoot: false, _isRootSolver: true,
    _data: { concept: 'RootSolver', description: 'Routes all problems through conceptual decomposition', depth: 0, id: 'ROOT_SOLVER', created_by_problem: 0,
      manifest: { bounds: 'All problem domains', not_in_scope: 'Direct solving — delegates to concept solvers' },
      feedback: { times_invoked: totalProblems, domains_served: [...new Set(paths.map(p=>p.domain))], problems_routed: paths.map(p=>p.problem_id) },
      consult: { estimated_quality_gain: 1.0 }, verify: { test_vectors: [] } },
  });

  // Concept solver nodes — size scales dramatically with invocations
  solvers.forEach(n => {
    const inv = n._inv || 1;
    const dc = n._doms ? n._doms.size : 1;
    let color;
    if (cm === 'domains') color = dcColor(dc);
    else if (cm === 'invocations') color = invColor(inv);
    else color = DC[n.feedback.domains_served[0]] || '#71717a';

    // Dramatic size scaling: small for 1 use, large for highway nodes
    const sizeRatio = inv / maxInv;
    const val = 1 + sizeRatio * 8;

    nodes.push({
      id: n.id, name: n.concept, desc: n.description,
      val, color, inv, dc, _data: n, _isRoot: false,
    });

    // Edge from RootSolver to each top-level concept
    if (n.depth <= 1) {
      links.push({
        source: 'ROOT_SOLVER', target: n.id,
        color: '#5eead440', width: Math.min(0.5 + inv * 0.3, 4),
      });
    }
  });

  const edgeSet = new Set();
  const edgeCount = {};
  edges.forEach(e => { const k = `${e.source}|${e.target}`; edgeCount[k] = (edgeCount[k]||0)+1; });

  // Problem nodes from routing_paths (small diamonds at the periphery)
  if (showProblems && treeData.routing_paths) {
    const pathsAtStep = treeData.routing_paths.filter(rp => rp.problem_id <= maxP);
    pathsAtStep.forEach(rp => {
      const rid = `problem_${rp.problem_id}`;
      const dom = rp.domain;
      nodes.push({
        id: rid,
        name: `#${rp.problem_id}: ${rp.problem_text.substring(0,35)}...`,
        desc: rp.problem_text, val: 0.3,
        color: DC[dom] || '#52525b',
        inv: 0, dc: 0, _isRoot: true, _domain: dom, _pid: rp.problem_id,
      });
      // Connect problem to all solvers it used
      (rp.path || []).forEach(step => {
        if (step.node && nodeMap[step.node]) {
          const k = `${rid}|${step.node}`;
          if (!edgeSet.has(k)) {
            edgeSet.add(k);
            links.push({
              source: rid, target: step.node,
              color: (DC[dom]||'#3f3f46') + '30',
              width: 0.2,
            });
          }
        }
      });
    });
  }

  edges.forEach(e => {
    if (!nodeMap[e.source] || !nodeMap[e.target]) return;
    const k = `${e.source}|${e.target}`;
    if (edgeSet.has(k)) return;
    edgeSet.add(k);
    links.push({
      source: e.source, target: e.target,
      color: '#ffffff18',
      width: Math.min(0.5 + (edgeCount[k]||1)*0.6, 5),
    });
  });

  solvers.forEach(n => {
    (n.parent_ids||[]).forEach(pid => {
      if (!nodeMap[pid]) return;
      const k = `${pid}|${n.id}`;
      if (edgeSet.has(k)) return;
      edgeSet.add(k);
      links.push({ source: pid, target: n.id, color: '#ffffff18', width: 0.8 });
    });
  });

  // Stats
  const ts = paths.reduce((s,rp) => s + rp.path.length, 0);
  const rs = paths.reduce((s,rp) => s + rp.path.filter(p => p.action==='reused').length, 0);
  const rPct = ts > 0 ? Math.round(rs/ts*100) : 0;
  const domSets = {};
  solvers.forEach(n => { domSets[n.id] = n._doms || new Set(); });
  const hw = Object.values(domSets).filter(s => s.size >= 3).length;
  document.getElementById('s-nodes').textContent = solvers.length;
  document.getElementById('s-reuse').textContent = rPct + '%';
  document.getElementById('s-highways').textContent = hw;

  return { nodes, links };
}

function init() {
  const maxP = treeData.routing_paths.length;
  const slider = document.getElementById('step-slider');
  slider.max = maxP; slider.value = maxP; currentStep = maxP;
  document.getElementById('step-display').textContent = `${maxP} / ${maxP}`;

  const container = document.getElementById('graph');
  const data = buildData(maxP);

  graph = ForceGraph3D()(container)
    .graphData(data)
    .nodeId('id')
    .nodeLabel('')
    .nodeColor(n => n.color)
    .nodeVal(n => n.val)
    .nodeRelSize(4)
    .nodeOpacity(0.92)
    .nodeThreeObject(node => {
      if (node._isRoot) return false;
      try {
        const T = window.THREE || THREE;
        const group = new T.Group();
        const inv = node.inv || 1;
        const radius = node._isRootSolver ? 5 : Math.max(1.5, 1 + Math.sqrt(node.val) * 1.2);
        // Core sphere
        const geo = new T.SphereGeometry(radius, 16, 16);
        const mat = new T.MeshBasicMaterial({ color: node.color, transparent: true, opacity: 0.92 });
        group.add(new T.Mesh(geo, mat));
        // Glow halo
        const spriteMat = new T.SpriteMaterial({
          map: createGlowTexture(T),
          color: node.color,
          transparent: true,
          opacity: node._isRootSolver ? 0.4 : 0.15 + Math.min(inv * 0.02, 0.4),
          blending: T.AdditiveBlending,
          depthWrite: false,
        });
        const sprite = new T.Sprite(spriteMat);
        const gs = node._isRootSolver ? 30 : Math.max(6, radius * 3 + inv * 0.8);
        sprite.scale.set(gs, gs, 1);
        group.add(sprite);
        // Label
        const c = document.createElement('canvas');
        const ctx = c.getContext('2d');
        c.width = 512; c.height = 64;
        ctx.fillStyle = '#ffffff';
        const fs = node._isRootSolver ? 28 : Math.max(18, Math.min(26, 16 + inv * 0.5));
        ctx.font = `600 ${fs}px Inter, sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillText(node.name, 256, 40);
        const tex = new T.CanvasTexture(c);
        const lm = new T.SpriteMaterial({ map: tex, transparent: true, opacity: 0.8, depthWrite: false });
        const label = new T.Sprite(lm);
        const ls = node._isRootSolver ? 28 : Math.max(16, 14 + inv * 0.3);
        label.scale.set(ls, ls * 64/512, 1);
        label.position.set(0, radius + 3, 0);
        group.add(label);
        return group;
      } catch(e) { console.error('nodeThreeObject error:', e); return false; }
    })
    .nodeThreeObjectExtend(false)
    .linkColor(l => l.color)
    .linkWidth(l => l.width)
    .linkOpacity(0.5)
    .backgroundColor('#06060a')
    .showNavInfo(false)
    .cooldownTime(2500)
    .warmupTicks(40)
    .onNodeHover(onHover)
    .onNodeClick(onClick)
    .width(container.offsetWidth)
    .height(container.offsetHeight);

  window.addEventListener('resize', () => {
    const c = document.getElementById('graph');
    graph.width(c.offsetWidth).height(c.offsetHeight);
  });

  slider.addEventListener('input', () => {
    currentStep = parseInt(slider.value);
    document.getElementById('step-display').textContent = `${currentStep} / ${maxP}`;
    graph.graphData(buildData(currentStep));
    updateReuseChart(currentStep);
    updateBudgetChart(currentStep);
  });

  document.getElementById('color-mode').addEventListener('change', () => {
    graph.graphData(buildData(currentStep));
  });

  document.getElementById('show-problems').addEventListener('change', () => {
    graph.graphData(buildData(currentStep));
  });

  document.getElementById('search-input').addEventListener('input', e => {
    const q = e.target.value.toLowerCase();
    if (!q) return;
    const gd = graph.graphData();
    const m = gd.nodes.find(n => n.name && n.name.toLowerCase().includes(q));
    if (m && m.x !== undefined) {
      graph.cameraPosition({ x:m.x, y:m.y, z:m.z+120 }, { x:m.x, y:m.y, z:m.z }, 800);
      onClick(m);
    }
  });

  document.getElementById('play-btn').addEventListener('click', togglePlay);
  buildProblemList();
  buildReuseChart();
  buildBudgetChart();
  setTimeout(() => graph.zoomToFit(500, 60), 2800);
}

// Glow texture
let _glowTex;
function createGlowTexture(T) {
  if (_glowTex) return _glowTex;
  T = T || window.THREE || THREE;
  const size = 128;
  const c = document.createElement('canvas');
  c.width = size; c.height = size;
  const ctx = c.getContext('2d');
  const grad = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  grad.addColorStop(0, 'rgba(255,255,255,1)');
  grad.addColorStop(0.15, 'rgba(255,255,255,0.6)');
  grad.addColorStop(0.5, 'rgba(255,255,255,0.1)');
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,size,size);
  _glowTex = new T.CanvasTexture(c);
  return _glowTex;
}

function onHover(node) {
  const tt = document.getElementById('tooltip');
  if (!node) { tt.style.display = 'none'; document.body.style.cursor = 'default'; return; }
  document.body.style.cursor = 'pointer';
  tt.querySelector('.tt-name').textContent = node.name;
  tt.querySelector('.tt-sub').textContent = node._isRoot
    ? (node._domain||'').replace(/_/g,' ')
    : `${node.inv} invocations · ${node.dc} domains`;
  tt.querySelector('.tt-desc').textContent = node.desc || '';
  tt.style.display = 'block';
  tt.style.borderLeftColor = node.color;
  const onM = e => { tt.style.left = (e.clientX+16)+'px'; tt.style.top = (e.clientY-10)+'px'; };
  document.addEventListener('mousemove', onM);
  if (node._rm) node._rm();
  node._rm = () => document.removeEventListener('mousemove', onM);
}

function onClick(node) {
  if (!node) return;
  if (node._isRoot && node._pid) {
    const rp = treeData.routing_paths.find(r => r.problem_id === node._pid);
    if (rp) showPath(rp);
    return;
  }
  if (node.x !== undefined) {
    graph.cameraPosition({ x:node.x, y:node.y, z:node.z+120 }, { x:node.x, y:node.y, z:node.z }, 800);
  }
  const d = node._data || node;
  const fb = d.feedback || {};
  const mn = d.manifest || {};
  const doms = fb.domains_served || [];
  const probs = fb.problems_routed || [];

  document.getElementById('panel-default').style.display = 'none';
  const panel = document.getElementById('panel-node');
  panel.style.display = 'block';
  panel.innerHTML = `
    <div class="ntitle">${d.concept || node.name}</div>
    <div class="nsub">${fb.times_invoked||node.inv||0} invocations · ${doms.length} domains</div>
    <div class="ndesc">${d.description || ''}</div>
    <div class="card">
      <h3>Manifest</h3>
      <p><b>Bounds:</b> ${mn.bounds || '—'}</p>
      <p><b>Not in scope:</b> ${mn.not_in_scope || '—'}</p>
    </div>
    <div class="card">
      <h3>Domains</h3>
      <div>${doms.map(d => `<span class="dtag" style="--dc:${DC[d]||'#555'}"><span style="background:var(--dc);width:5px;height:5px;border-radius:50%;display:inline-block;box-shadow:0 0 6px var(--dc)"></span>${d.replace(/_/g,' ')}</span>`).join('')}</div>
    </div>
    <div class="card">
      <h3>Problems (${probs.length})</h3>
      <ul>${probs.slice(0,12).map(pid => {
        const rp = treeData.routing_paths.find(r => r.problem_id === pid);
        return `<li>#${pid}: ${rp ? rp.problem_text : ''}</li>`;
      }).join('')}${probs.length > 12 ? `<li style="color:var(--text-2)">+${probs.length-12} more</li>` : ''}</ul>
    </div>
    ${(d.verify && d.verify.test_vectors && d.verify.test_vectors.length > 0) ? `
    <div class="card">
      <h3>Verify (Acceptance Tests)</h3>
      <ul>${d.verify.test_vectors.map(t => `<li>${t}</li>`).join('')}</ul>
    </div>` : ''}
    <div class="card">
      <h3>Metadata</h3>
      <p style="font-family:'JetBrains Mono',monospace;font-size:10px;">
        depth: ${d.depth||0} &middot; id: ${d.id||node.id} &middot; created_by: #${d.created_by_problem||'?'}
      </p>
    </div>
    <button class="back-btn" onclick="hidePanel()">Back to list</button>
  `;
}

function showPath(rp) {
  document.getElementById('panel-default').style.display = 'none';
  const panel = document.getElementById('panel-node');
  panel.style.display = 'block';

  // Use full narrative trace if available, otherwise fall back to path
  const trace = rp.trace || rp.path;
  const traceHtml = trace.map(t => {
    const depth = t.depth || 0;
    const indent = '&nbsp;'.repeat(depth * 4);
    const color = t.action === 'reused' ? '#a6e3a1' :
                  t.action === 'created' ? '#f9e2af' :
                  t.action === 'mvr_decompose' ? '#89dceb' :
                  t.action === 'receive' ? '#5eead4' :
                  t.action === 'complete' || t.action === 'summary' ? '#5eead4' :
                  '#9399b2';
    const icon = t.action === 'reused' ? '♻' :
                 t.action === 'created' ? '✦' :
                 t.action === 'mvr_decompose' ? '↓' :
                 t.action === 'mvr_stop' ? '·' :
                 t.action === 'receive' ? '▸' :
                 t.action === 'complete' || t.action === 'summary' ? '▪' :
                 '·';
    const produces = t.what_it_produces ? `<div style="margin:2px 0 6px ${depth * 4 * 6 + 16}px;font-size:11px;color:#6b8a7a;border-left:2px solid #2a3a2a;padding-left:8px;">→ ${t.what_it_produces}</div>` : '';
    return `<div style="margin:3px 0;font-size:11px;line-height:1.5;">
      ${indent}<span style="color:${color}">${icon}</span>
      <span style="color:${t.node ? '#e4e4e7' : '#9399b2'}">${t.narrative || t.concept || ''}</span>
    </div>${produces}`;
  }).join('');

  panel.innerHTML = `
    <div class="ntitle">Problem #${rp.problem_id}</div>
    <div class="nsub">${rp.domain.replace(/_/g,' ')} · budget: ${rp.budget} (used: ${rp.budget_used})</div>
    <div class="ndesc">${rp.problem_text}</div>
    <div class="card">
      <h3>Execution Trace</h3>
      ${traceHtml}
    </div>
    <button class="back-btn" onclick="hidePanel()">Back to list</button>
  `;
}

function hidePanel() {
  document.getElementById('panel-default').style.display = 'block';
  document.getElementById('panel-node').style.display = 'none';
}

function buildProblemList() {
  const list = document.getElementById('problem-list');
  treeData.routing_paths.forEach(rp => {
    const div = document.createElement('div');
    div.className = 'problem-item';
    div.innerHTML = `<span class="pid">#${rp.problem_id}</span> <span class="pdom">${rp.domain.replace(/_/g,' ')}</span><br>${rp.problem_text}`;
    div.addEventListener('click', () => showPath(rp));
    list.appendChild(div);
  });
}

function buildReuseChart() {
  if (!statsData?.reuse_curve) return;
  const ctx = document.getElementById('reuse-chart').getContext('2d');
  const grad = ctx.createLinearGradient(0, 0, 0, 140);
  grad.addColorStop(0, 'rgba(94,234,212,0.2)');
  grad.addColorStop(1, 'rgba(94,234,212,0)');
  reuseChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: statsData.reuse_curve.map(r => r.problem),
      datasets: [
        {
          label: 'Per problem',
          data: statsData.reuse_curve.map(r => r.reuse_pct * 100),
          borderColor: 'rgba(94,234,212,0.3)', backgroundColor: grad,
          fill: true, tension: 0.4, pointRadius: 1, borderWidth: 1,
        },
        {
          label: 'Trend (10-avg)',
          data: (statsData.rolling_reuse || []).map(r => r.rolling_avg * 100),
          borderColor: '#5eead4', backgroundColor: 'transparent',
          fill: false, tension: 0.4, pointRadius: 0, borderWidth: 2.5,
        },
      ],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      scales: {
        x: { ticks: { color: '#3f3f46', maxTicksLimit: 10, font:{ size:9, family:'JetBrains Mono' } }, grid: { color: 'rgba(255,255,255,0.03)' }, border: { display: false } },
        y: { ticks: { color: '#3f3f46', font:{ size:9, family:'JetBrains Mono' } }, grid: { color: 'rgba(255,255,255,0.03)' }, border: { display: false }, min: 0, max: 100 },
      },
      plugins: { legend: { display: false } },
    },
  });
}

function updateReuseChart(step) {
  if (!reuseChart || !statsData) return;
  const d = statsData.reuse_curve.slice(0, step);
  const r = (statsData.rolling_reuse || []).slice(0, step);
  reuseChart.data.labels = d.map(x => x.problem);
  reuseChart.data.datasets[0].data = d.map(x => x.reuse_pct * 100);
  reuseChart.data.datasets[1].data = r.map(x => x.rolling_avg * 100);
  reuseChart.update('none');
}

function updateBudgetChart(step) {
  if (!budgetChart || !statsData) return;
  const d = statsData.budget_allocation.slice(0, step);
  budgetChart.data.labels = d.map(b => b.problem);
  budgetChart.data.datasets[0].data = d.map(b => b.spent);
  budgetChart.data.datasets[1].data = d.map(b => b.budget - b.spent);
  budgetChart.update('none');
}

function buildBudgetChart() {
  if (!statsData?.budget_allocation) return;
  const ctx = document.getElementById('budget-chart').getContext('2d');
  budgetChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: statsData.budget_allocation.map(b => b.problem),
      datasets: [
        { data: statsData.budget_allocation.map(b => b.spent), backgroundColor: '#5eead4', borderRadius: 2 },
        { data: statsData.budget_allocation.map(b => b.budget - b.spent), backgroundColor: 'rgba(255,255,255,0.04)', borderRadius: 2 },
      ],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      scales: {
        x: { stacked: true, ticks: { color: '#3f3f46', maxTicksLimit: 10, font:{ size:9, family:'JetBrains Mono' } }, grid: { display: false }, border: { display: false } },
        y: { stacked: true, ticks: { color: '#3f3f46', font:{ size:9, family:'JetBrains Mono' } }, grid: { color: 'rgba(255,255,255,0.03)' }, border: { display: false } },
      },
      plugins: { legend: { display: false } },
    },
  });
}

function togglePlay() {
  const btn = document.getElementById('play-btn');
  if (isPlaying) { isPlaying = false; btn.textContent = 'Play'; return; }
  isPlaying = true; btn.textContent = 'Pause';
  const slider = document.getElementById('step-slider');
  const max = parseInt(slider.max);

  // Start from current position, or from 1 if already at the end
  let step = currentStep >= max ? 1 : currentStep + 1;
  if (step === 1) {
    graph.graphData(buildData(0));
  }

  function tick() {
    if (!isPlaying || step > max) { isPlaying = false; btn.textContent = 'Play'; return; }
    slider.value = step; currentStep = step;
    document.getElementById('step-display').textContent = `${step} / ${max}`;

    const newData = buildData(step);
    const currentData = graph.graphData();
    const currentNodeMap = {};
    currentData.nodes.forEach(n => { currentNodeMap[n.id] = n; });

    // Find truly new nodes and edges this step
    const newNodes = newData.nodes.filter(n => !currentNodeMap[n.id]);
    const currentEdgeSet = new Set(currentData.links.map(l => {
      const sid = typeof l.source === 'object' ? l.source.id : l.source;
      const tid = typeof l.target === 'object' ? l.target.id : l.target;
      return `${sid}|${tid}`;
    }));
    const newLinks = newData.links.filter(l => !currentEdgeSet.has(`${l.source}|${l.target}`));

    // Update existing nodes in-place (smooth size growth)
    currentData.nodes.forEach(existingNode => {
      const updated = newData.nodes.find(n => n.id === existingNode.id);
      if (updated) {
        const targetVal = updated.val;
        existingNode.val = existingNode.val + (targetVal - existingNode.val) * 0.5;
        existingNode.inv = updated.inv;
        existingNode.dc = updated.dc;
        existingNode.color = updated.color;
      }
    });

    // Add new nodes and edges
    if (newNodes.length > 0 || newLinks.length > 0) {
      graph.graphData({
        nodes: [...currentData.nodes, ...newNodes],
        links: [...currentData.links, ...newLinks],
      });
    } else {
      graph.nodeVal(graph.nodeVal());
    }

    updateReuseChart(step);
    updateBudgetChart(step);
    step++;
    setTimeout(tick, 600);
  }
  tick();
}

load();
